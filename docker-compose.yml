services:
  retention-service:
    build: .
    image: retention-policy-service:latest
    container_name: retention-policy-service
    ports:
      - "8000:8000"
    environment:
      # SQLite 数据库文件位置（挂载到命名卷持久化）
      RETENTION_DB_PATH: /data/policies.db
      # 数据库为空时自动写入示例策略；置 false 可禁用
      SEED_ON_STARTUP: "true"
      RETENTION_TIMEZONE: UTC
    volumes:
      - retention-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  retention-data:
